name: Android APK

on:
  push:
    branches: ["android-native-socialhub"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deduplicate native dependencies
        run: npm dedupe --no-audit --no-fund

      - name: Validate mobile TypeScript
        run: npx tsc --noEmit

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build installable debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: socialhub-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
