name: Android Mobile CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-mobile-ci.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "mobile/**"
      - ".github/workflows/android-mobile-ci.yml"

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deduplicate native dependencies
        run: npm dedupe --no-audit --no-fund

      - name: Expo doctor
        run: npx expo-doctor

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
