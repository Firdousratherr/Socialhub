name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Database schema validation
        run: npm run db:validate

      - name: Type check
        run: npm run typecheck

      - name: Repository integrity smoke test
        run: node scripts/repository-smoke.mjs

      - name: Blueprint contract tests
        run: node --test tests/blueprint-contracts.test.mjs

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build:ci
